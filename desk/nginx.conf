# Desk SPA (nginx-unprivileged, cổng 8080): fallback index.html cho route phía client (/auth/callback, ...).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    # Sandbox bootstrap needs only the parent origin; never expose paths or query strings.
    add_header Referrer-Policy "strict-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    location = /sandbox.html {
        # Defining headers here replaces server-level headers, including X-Frame-Options.
        # The trusted bootstrap installs the per-App CSP before loading untrusted srcdoc.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin" always;
        add_header Content-Security-Policy "frame-ancestors @@DESK_ORIGIN@@; base-uri 'none'; object-src 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Trusted product modules share the portal origin; MCP tool HTML still uses its sandbox.
    location ~ ^/(studio|waretrack)/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }
}
