[request_definition]
r = sub, dom, obj, act, ctx

[policy_definition]
p = sub, dom, obj, act, sid, eft

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = r.dom == p.dom && (p.sub == "*" || r.sub == p.sub || g(r.sub, p.sub, r.dom)) && star(p.obj, r.obj) && star(p.act, r.act) && checks(r.ctx, p.sid)
