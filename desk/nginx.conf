# Desk SPA (nginx-unprivileged, cổng 8080): fallback index.html cho route phía client (/auth/callback, ...).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-src https:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    location / {
        try_files $uri /index.html;
    }
}
