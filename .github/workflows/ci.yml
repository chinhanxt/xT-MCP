name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint (ruff + mypy)
        run: make lint
      - name: Import boundaries
        run: uv run lint-imports
      - name: REUSE
        run: uv run reuse lint
      - name: Tests
        run: uv run pytest
