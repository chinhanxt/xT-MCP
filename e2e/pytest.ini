[pytest]
testpaths = scenarios
python_files = test_*.py
addopts = -p no:cacheprovider -ra --no-header
markers =
    e2e: kịch bản e2e trên stack compose minimal thật (make e2e)
    llm: cần LLM local Ollama qwen3.5:4b (make e2e-llm)
