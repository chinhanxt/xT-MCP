  legal_basis: 'Mẫu số 04-LĐTL (Giấy đi đường) có trong Thông tư 200/2014/TT-BTC và Thông tư 133/2016/TT-BTC (cùng số 04-LĐTL, không phải 06-LĐTL). Thông tư 99/2025/TT-BTC (Phụ lục I, 33 mẫu) KHÔNG còn
    mẫu Giấy đi đường: doanh nghiệp dùng mẫu 04-LĐTL cũ làm tham khảo hoặc tự thiết kế. Mẫu C16-HD thuộc Thông tư 107/2017/TT-BTC dành cho đơn vị hành chính sự nghiệp, không áp dụng cho doanh nghiệp'
  verified: false
  source_url:
  - https://luatvietnam.vn/linh-vuc-khac/danh-muc-33-bieu-mau-chung-tu-ke-toan-theo-thong-tu-99-883-105817-article.html
  - https://thuvienphapluat.vn/lao-dong-tien-luong/mau-giay-di-duong-moi-nhat-2025-la-mau-nao-47952.html
  verification_note: 'Sai: ''Mẫu 06-LĐTL theo TT133'' - thực tế 04-LĐTL. ''Mã số'', ''Tiền tạm ứng đã nhận'' là mở rộng nội bộ. Mẫu chuẩn: số, người được cấp, chức vụ, nơi đến công tác, công lệnh, thời
    gian, phương tiện, xác nhận nơi đến. Số hiệu mẫu 06-LĐTL của TT133 chưa kiểm tra thấy ở nguồn nào.'
