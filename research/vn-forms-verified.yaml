  legal_basis: Mẫu số 03-TT (Giấy đề nghị tạm ứng) tại Phụ lục I Thông tư 99/2025/TT-BTC (hiệu lực 01/01/2026, thay thế Thông tư 200/2014/TT-BTC; chỉ để tham khảo theo Điều 9, doanh nghiệp được tự thiết
    kế nhưng phải đáp ứng Điều 16 Luật Kế toán 2015). Doanh nghiệp nhỏ và vừa vẫn được tiếp tục áp dụng Thông tư 133/2016/TT-BTC (chưa bị thay thế; dự thảo thay thế mới công bố, chưa rõ đã ban hành) hoặc
    tự nguyện chuyển sang TT 99 (khoản 3 Điều 31)
  verified: true
  source_url:
  - https://luatvietnam.vn/linh-vuc-khac/danh-muc-33-bieu-mau-chung-tu-ke-toan-theo-thong-tu-99-883-105817-article.html
  - https://thuvienphapluat.vn/ma-so-thue/phap-luat-thue/thong-tu-992025-co-thay-the-thong-tu-1332016-che-do-ke-toan-doanh-nghiep-nho-va-vua-213873.html
  verification_note: 'Sai/thừa so với mẫu chuẩn: ''Hình thức nhận tiền'', ''Số tài khoản ngân hàng thụ hưởng'', ''Mã phiếu'', ''Số tiền bằng chữ'' tách riêng là mở rộng nội bộ, không có trong mẫu 03-TT
    (mẫu chuẩn: Kính gửi, Tên tôi là, Bộ phận, Đề nghị tạm ứng số tiền (bằng số, bằng chữ), Lý do tạm ứng, Thời hạn thanh toán). Chữ ký chuẩn gồm Giám đốc, Kế toán trưởng, Phụ trách bộ phận, Người đề nghị;
    ''Kế toán thanh toán'' không có trong mẫu chuẩn (chữ ký chuẩn mô tả theo kiến thức, chưa tải được PDF mẫu).'
