[project]
name = "xt"
version = "0.1.0.dev0"
description = "xT - Agent-native DX-OS: MCP server đa năng cho doanh nghiệp"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "xT contributors" }]
dependencies = [
    "cryptography>=50.0.2,<51",
    "httpx==0.28.1",
    "psycopg>=3.3.6,<3.4",
    "psycopg-pool>=3.3.3,<3.4",
    "procrastinate==3.10.0",
    "croniter>=6,<7",
    "pydantic>=2.14.1,<3",
    "pyjwt[crypto]==2.15.1",
    "spiffworkflow==3.2.0",
    "lxml>=6.1.3,<7",
    "python-dateutil>=2.9.0.post0,<3",
    "mcp>=2.3,<3",
    "jsonschema>=4.26,<5",
    "starlette>=1.8,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
xt = "xt.entrypoints.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "import-linter>=2.0",
  "reuse>=5",
  "casbin>=1.43,<2",
  "hypothesis>=6.100",
  "sqlglot>=30.23,<31",
  "types-croniter>=6,<7",
  "jsonschema>=4.26,<5",
  "types-python-dateutil>=2.9.0.20260807",
  "lxml-stubs>=0.5.1",
  "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["xt"]

# SpiffWorkflow 3.2.0 không có type hint/py.typed; chỉ adapters/workflow import nó.
[[tool.mypy.overrides]]
module = ["SpiffWorkflow", "SpiffWorkflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=xt --cov-report=term-missing -m \"not slow and not integration\""
markers = [
  "slow: benchmark chậm, chạy bằng pytest -m slow",
  "integration: cần docker (Keycloak 26.6.3, postgres:17-alpine) thật (make test-integration)",
]

[tool.coverage.run]
source = ["xt"]

[tool.importlinter]
root_package = "xt"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Phụ thuộc hướng vào trong: entrypoints/adapters -> application -> contracts -> domain"
type = "layers"
layers = [
  "xt.entrypoints",
  "xt.adapters",
  "xt.application",
  "xt.contracts",
  "xt.domain",
]

[[tool.importlinter.contracts]]
name = "Các adapter độc lập với nhau"
type = "independence"
modules = [
  "xt.adapters.mcp",
  "xt.adapters.http",
  "xt.adapters.db",
  "xt.adapters.workflow",
  "xt.adapters.queue",
  "xt.adapters.blob",
  "xt.adapters.identity",
  "xt.adapters.notify",
]

[[tool.importlinter.contracts]]
name = "Chỉ adapters.workflow được import SpiffWorkflow/lxml (architecture-v2 §4.2)"
type = "forbidden"
source_modules = [
  "xt.domain",
  "xt.contracts",
  "xt.application",
  "xt.entrypoints",
  "xt.adapters.mcp",
  "xt.adapters.http",
  "xt.adapters.db",
  "xt.adapters.queue",
  "xt.adapters.blob",
  "xt.adapters.identity",
  "xt.adapters.notify",
]
forbidden_modules = ["SpiffWorkflow", "lxml"]
# Composition root (entrypoints) dựng SpiffProcessEngine qua adapters.workflow: chỉ cấm import trực
# tiếp (docs/decisions.md, D-INT-1).
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Chỉ adapters.db (và adapters.queue cho hàng đợi) được import psycopg (architecture-v2 §4.2)"
type = "forbidden"
source_modules = [
  "xt.domain",
  "xt.contracts",
  "xt.application",
  "xt.entrypoints",
  "xt.adapters.mcp",
  "xt.adapters.http",
  "xt.adapters.workflow",
  "xt.adapters.blob",
  "xt.adapters.identity",
  "xt.adapters.notify",
]
forbidden_modules = ["psycopg", "psycopg_pool"]
allow_indirect_imports = true
