[project]
name = "xt"
version = "0.1.0.dev0"
description = "xT - Agent-native DX-OS: MCP server đa năng cho doanh nghiệp"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "xT contributors" }]
dependencies = []

[project.scripts]
xt = "xt.adapters.cli.main:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "import-linter>=2.0",
  "reuse>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["xt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=xt --cov-report=term-missing"

[tool.coverage.run]
source = ["xt"]

[tool.importlinter]
root_package = "xt"

[[tool.importlinter.contracts]]
name = "Phụ thuộc hướng vào trong: entrypoints/adapters -> application -> contracts -> domain"
type = "layers"
layers = [
  "xt.entrypoints",
  "xt.adapters",
  "xt.application",
  "xt.contracts",
  "xt.domain",
]

[[tool.importlinter.contracts]]
name = "Các adapter độc lập với nhau"
type = "independence"
modules = [
  "xt.adapters.mcp",
  "xt.adapters.http",
  "xt.adapters.db",
  "xt.adapters.workflow",
  "xt.adapters.blob",
  "xt.adapters.identity",
  "xt.adapters.notify",
]
