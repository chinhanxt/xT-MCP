# SPDX-FileCopyrightText: 2026 xT contributors
# Ảnh pin theo digest (tag giữ để đọc). Profile: minimal (mặc định, gồm seaweedfs) | full (= minimal + ollama, nats, clamav, openbao) | public (+ cloudflared).
#   docker compose --env-file .env --profile minimal up -d
#   docker compose --env-file .env --profile minimal --profile full --profile public up -d
# `xt serve` chưa có: dùng service `xt-api-placeholder` (profile placeholder) thay `xt-api`; Makefile tự chọn.
name: xt

x-restart: &restart
  restart: unless-stopped

# Hardening chung. cap_drop ALL chỉ áp cho dịch vụ đã chạy thử (minimal); profile full: chỉ no-new-privileges + pids.
x-nopriv: &nopriv
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
x-hardened: &hardened
  <<: *nopriv
  cap_drop: [ALL]

# Biến chung cho mọi tiến trình xT (khóa audit); đường dẫn là trong container.
x-xt-db-env: &xt-db-env
  XT_AUDIT_KEY_FILE: /run/secrets/xt/audit.key
  XT_AUDIT_KEY_ID: ${XT_AUDIT_KEY_ID:-1}

services:
  postgres:
    <<: [*restart, *hardened]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]   # entrypoint chown + gosu
    read_only: true
    tmpfs: [/tmp, /run/postgresql]
    cpus: 1.0
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [minimal, full, public, placeholder]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xt}
      POSTGRES_DB: ${POSTGRES_DB:-xt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chạy make env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "log_statement=none", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0", "-c", "log_error_verbosity=terse", "-c", "log_min_duration_statement=-1", "-c", "log_min_duration_sample=-1", "-c", "log_transaction_sample_rate=0"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 40

  keycloak:
    <<: [*restart, *hardened]
    read_only: true
    tmpfs: [/tmp, /opt/keycloak/data]
    cpus: 2.0
    image: xt/keycloak:26.6.3-optimized
    build:
      context: ./docker
      dockerfile: keycloak.Dockerfile
    profiles: [minimal, full, public, placeholder]
    command: ["start", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-xt}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?chạy make env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?chạy make env}
      KC_HOSTNAME: https://${XT_DOMAIN_AUTH:?}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: ${KC_HEAP:--Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m}
    ports:
      - "127.0.0.1:${KC_HTTP_PORT:-18080}:8080"
    mem_limit: 768m
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # Ảnh Keycloak không có curl; health nằm ở cổng quản trị 9000
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      retries: 40
      start_period: 20s

  apisix:
    <<: [*restart, *hardened]
    cpus: 1.0   # read_only chưa áp: nginx.conf sinh lúc khởi động trong conf/ (lẫn bind mount)
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    profiles: [minimal, full, public, placeholder]
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # Sinh bởi scripts/render_apisix.py từ apisix.yaml.tmpl + .env (hostname không hard-code)
      - ./apisix/rendered/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:${APISIX_HTTP_PORT:-9080}:9080"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080 && printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3 && head -c 8 <&3 | grep -q HTTP'"]
      interval: 5s
      retries: 20

  # Khởi tạo DB một lần (idempotent): bootstrap role/schema, migrate, schema hàng đợi. xt-api/xt-worker chờ nó xong.
  xt-init:
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    cpus: 0.5
    image: xt/xt:dev
    build:
      context: ..
      dockerfile: deploy/docker/xt.Dockerfile
    profiles: [minimal, full, public]
    restart: "no"
    entrypoint: ["python", "/init/init_db.py"]
    environment:
      <<: *xt-db-env
      XT_INIT_SUPERUSER_URL: postgresql://${POSTGRES_USER:-xt}:${POSTGRES_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      XT_DB_MIGRATOR_URL: postgresql://xt_migrator:${XT_DB_MIGRATOR_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      XT_DB_APP_PASSWORD: ${XT_DB_APP_PASSWORD:?chạy make env}
      XT_DB_MIGRATOR_PASSWORD: ${XT_DB_MIGRATOR_PASSWORD:?chạy make env}
      XT_DB_CONTROL_PASSWORD: ${XT_DB_CONTROL_PASSWORD:?chạy make env}
      XT_QUEUE_DATABASE_URL: postgresql://xt_control:${XT_DB_CONTROL_PASSWORD}@postgres:5432/${POSTGRES_DB:-xt}
      XT_WORKER_DATABASE_URL: postgresql://xt_app:${XT_DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-xt}
      XT_WORKER_CONCURRENCY: ${XT_WORKER_CONCURRENCY:-2}
      XT_WORKER_STALLED_SECONDS: ${XT_WORKER_STALLED_SECONDS:-30}
      XT_WORKER_RECOVER_SECONDS: ${XT_WORKER_RECOVER_SECONDS:-5}
      XT_WORKER_MAX_ATTEMPTS: ${XT_WORKER_MAX_ATTEMPTS:-3}
      XT_WORKER_RETRY_SECONDS: ${XT_WORKER_RETRY_SECONDS:-30}
      XT_WORKER_HANDLERS: ${XT_WORKER_HANDLERS:-xt.entrypoints.composition.worker:handlers}
      XT_WORKFLOW_RELAY_SECONDS: ${XT_WORKFLOW_RELAY_SECONDS:-15}
      # `docker compose run --rm xt-init xt tenant bind-queue --tenant <alias>` (job role + relay)
      XT_DB_OWNER_URL: postgresql://${POSTGRES_USER:-xt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xt}
    volumes:
      - ./scripts/init_db.py:/init/init_db.py:ro
      - type: bind
        source: ${XT_SECRETS_DIR:-${HOME}/.config/xt}/app
        target: /run/secrets/xt
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 256m
    depends_on:
      postgres: {condition: service_healthy}

  # Cấu hình thiếu/sai: `xt serve` thoát ngay với danh sách lỗi; on-failure:5 thử tối đa 5 lần rồi dừng (không lặp vô hạn).
  xt-api:
    <<: [*hardened]
    restart: on-failure:5
    read_only: true
    tmpfs: [/tmp]
    cpus: 1.0
    image: xt/xt:dev
    build:
      context: ..
      dockerfile: deploy/docker/xt.Dockerfile
    profiles: [minimal, full, public]
    networks: [default, files]   # files: chỉ để gọi S3 nội bộ (FB-03)
    command: ["serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      <<: *xt-db-env
      XT_DB_APP_URL: postgresql://xt_app:${XT_DB_APP_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      XT_DB_MIGRATOR_URL: postgresql://xt_migrator:${XT_DB_MIGRATOR_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      XT_IDP_ISSUER: https://${XT_DOMAIN_AUTH}/realms/${XT_REALM:-xt}
      XT_IDP_JWKS_URL: http://keycloak:8080/realms/${XT_REALM:-xt}/protocol/openid-connect/certs
      XT_IDP_ALLOW_HTTP: "true"   # chỉ cho URL nội bộ docker (JWKS, introspection, token confirm)
      XT_IDP_TENANT_CLAIM: organization
      XT_IDP_INTROSPECTION: ${XT_IDP_INTROSPECTION:-high_risk}
      XT_IDP_INTROSPECTION_URL: http://keycloak:8080/realms/${XT_REALM:-xt}/protocol/openid-connect/token/introspect
      XT_IDP_INTROSPECTION_CLIENT_ID: ${XT_IDP_INTROSPECTION_CLIENT_ID:-xt-api-introspect}
      XT_IDP_INTROSPECTION_CLIENT_SECRET: ${XT_IDP_INTROSPECTION_CLIENT_SECRET:?chạy make env}
      XT_MCP_RESOURCE: https://${XT_DOMAIN_MCP}/mcp
      XT_MCP_ALLOWED_CLIENTS: ${XT_MCP_ALLOWED_CLIENTS:-}
      XT_MCP_CLIENT_REGISTRY: ${XT_MCP_CLIENT_REGISTRY:-keycloak}
      # REST /workflow/v1 (docs/workflow-api.md): azp được gọi = đúng client mà provision_data.py cấp scope xt-workflow
      XT_WORKFLOW_ALLOWED_CLIENTS: ${XT_WORKFLOW_CLIENTS:-xt-cli}
      XT_WORKFLOW_AUDIENCE: xt-workflow
      XT_WORKFLOW_PUBLIC_URL: https://${XT_DOMAIN_API}
      # Dữ liệu phi cấu trúc /files/v1 + tool upload_file (docs/files-api.md): SeaweedFS S3 nội bộ
      XT_MCP_CAPABILITIES: ${XT_MCP_CAPABILITIES:-upload_file}
      # Telegram display channel runs inside xt-api; delivery relay in xt-worker.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_LINK_CLIENTS: ${TELEGRAM_LINK_CLIENTS:-xt-cli,xt-desk-agent}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      XT_FILES_S3_ENDPOINT: http://seaweedfs:8333
      XT_FILES_S3_BUCKET: ${XT_FILES_S3_BUCKET:-xt-files}
      XT_FILES_S3_ACCESS_KEY: ${XT_FILES_S3_ACCESS_KEY:?chạy make env}
      XT_FILES_S3_SECRET_KEY: ${XT_FILES_S3_SECRET_KEY:?chạy make env}
      XT_FILES_PUBLIC_URL: https://${XT_DOMAIN_API}
      XT_FILES_ALLOWED_CLIENTS: ${XT_FILES_CLIENTS:-xt-cli}
      XT_FILES_MAX_BYTES: ${XT_FILES_MAX_BYTES:-26214400}
      XT_FILES_UPLOAD_TTL_SECONDS: ${XT_FILES_UPLOAD_TTL_SECONDS:-900}
      XT_FILES_UNSCANNED_DOWNLOAD: ${XT_FILES_UNSCANNED_DOWNLOAD:-readers}
      XT_FILES_MAX_PENDING_PER_USER: ${XT_FILES_MAX_PENDING_PER_USER:-20}
      XT_FILES_USER_QUOTA_BYTES: ${XT_FILES_USER_QUOTA_BYTES:-268435456}
      XT_FILES_TENANT_QUOTA_BYTES: ${XT_FILES_TENANT_QUOTA_BYTES:-1073741824}
      XT_FILES_CLAMD: ${XT_FILES_CLAMD:-}   # profile full: clamav:3310 (tệp ở trạng thái scanning tới khi ClamAV trả lời)
      XT_IDP_ADMIN_API_URL: http://keycloak:8080/admin/realms/${XT_REALM:-xt}
      XT_IDP_ADMIN_TOKEN_URL: http://keycloak:8080/realms/${XT_REALM:-xt}/protocol/openid-connect/token
      XT_IDP_ADMIN_CLIENT_ID: ${XT_IDP_ADMIN_CLIENT_ID:-xt-client-registry}
      XT_IDP_ADMIN_CLIENT_SECRET: ${XT_IDP_ADMIN_CLIENT_SECRET:?chạy make env}
      XT_MCP_CONNECTOR_REDIRECT_HOSTS: ${XT_MCP_CONNECTOR_REDIRECT_HOSTS:-chatgpt.com,claude.ai,127.0.0.1}
      # M6: chỉ client xác nhận là "human"; chat Desk là agent tier masked (docs/decisions.md "Tier PII của Desk chat"); XT_MCP_LOCAL_CLIENTS chỉ dành cho client confidential phía server
      XT_MCP_HUMAN_CLIENTS: ${XT_CONFIRM_CLIENT_ID:-xt-desk-confirm}
      XT_MCP_LOCAL_CLIENTS: ${XT_MCP_LOCAL_CLIENTS:-}
      XT_MCP_REQUIRED_SCOPES: ${XT_MCP_REQUIRED_SCOPES:-mcp-xt}
      XT_MCP_SCOPES_SUPPORTED: ${XT_MCP_SCOPES_SUPPORTED:-mcp-xt openid profile email}
      XT_CONFIRM_CLIENT_ID: ${XT_CONFIRM_CLIENT_ID:-xt-desk-confirm}
      XT_CONFIRM_ACR: ${XT_CONFIRM_ACR:-urn:xt:acr:otp}
      XT_CONFIRM_REQUIRED_AMR: ${XT_CONFIRM_REQUIRED_AMR:-otp}
      XT_CONFIRM_AUTHORIZATION_URL: https://${XT_DOMAIN_AUTH}/realms/${XT_REALM:-xt}/protocol/openid-connect/auth
      XT_CONFIRM_TOKEN_URL: http://keycloak:8080/realms/${XT_REALM:-xt}/protocol/openid-connect/token
      XT_RECEIPT_ISSUER: https://${XT_DOMAIN_MCP}
      XT_RECEIPT_SIGNING_KEY_FILE: /run/secrets/xt/receipt-ed25519.pem
      XT_RECEIPT_TTL_SECONDS: ${XT_RECEIPT_TTL_SECONDS:-300}
      XT_CURSOR_KEY_FILE: /run/secrets/xt/cursor.key
      XT_PII_KEY_FILE: /run/secrets/xt/pii.key
      XT_MCP_SERVICES: ${XT_MCP_SERVICES:-xt.entrypoints.composition:build}   # module:factory trả ToolServices/composition
      XT_DESK_URL: https://${XT_DOMAIN_DESK}
      # Kênh người xem PII (/pii/reveal): CORS chỉ cho origin Desk; chỉ client Desk xin được vé
      XT_PII_REVEAL_ORIGINS: https://${XT_DOMAIN_DESK}
      XT_PII_REVEAL_CLIENTS: ${XT_DESK_AGENT_CLIENT_ID:-xt-desk-agent}
      XT_PII_REVEAL_TICKETS_PER_MINUTE: ${XT_PII_REVEAL_TICKETS_PER_MINUTE:-10}
      XT_DPOP_REQUIRED: ${XT_DPOP_REQUIRED:-false}   # RFC 9449 cho xt-desk-agent; bật sau cổng e2e (provision.py dùng cùng cờ)
      XT_DPOP_CLIENTS: ${XT_DPOP_CLIENTS:-${XT_DESK_AGENT_CLIENT_ID:-xt-desk-agent}}   # DPA-06: cùng client mà provision.py ép DPoP
      XT_DPOP_REPLAY_STORE: postgres   # DPA-02: cache jti chung (xt_identity.dpop_jti), sống qua restart/nhiều worker
      XT_MCP_CONFIDENTIAL_CLIENTS: ${XT_MCP_CONFIDENTIAL_CLIENTS:-}
      # Desk gọi /mcp cùng origin qua host Desk (route desk-mcp): thêm host + origin Desk
      XT_MCP_ALLOWED_HOSTS: ${XT_DOMAIN_MCP},${XT_DOMAIN_DESK}
      XT_MCP_ALLOWED_ORIGINS: https://${XT_DOMAIN_DESK}
    volumes:
      - type: bind
        source: ${XT_SECRETS_DIR:-${HOME}/.config/xt}/app
        target: /run/secrets/xt
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      xt-init: {condition: service_completed_successfully}
      seaweedfs: {condition: service_healthy}

  # Chỉ dùng khi `xt serve` chưa tồn tại: trả 503 + thông báo rõ ràng, KHÔNG giả lập API.
  xt-api-placeholder:
    image: alpine:latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    profiles: [placeholder]
    <<: *hardened
    user: "65534:65534"
    read_only: true
    cpus: 0.1
    networks:
      default:
        aliases: [xt-api]
    command:
      - sh
      - -c
      - |
        body='{"error":"chua_trien_khai","message":"xt-api chưa triển khai: lệnh `xt serve` chưa tồn tại. Đây là container tạm (deploy/compose.yaml, service xt-api-placeholder)."}'
        while true; do
          printf 'HTTP/1.1 503 Service Unavailable\r\nContent-Type: application/json; charset=utf-8\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' "$${#body}" "$$body" | nc -l -p 8000 >/dev/null
        done
    mem_limit: 16m

  # PostgREST: /data (Tầng 1 Data). Không publish cổng; APISIX gọi qua mạng compose. Login xt_authenticator → xt_web.
  # JWKS (khóa công khai Keycloak) nằm ngoài repo: make pgrst-jwks (scripts/fetch_jwks.py) ghi ${XT_SECRETS_DIR}/pgrst/jwks.json.
  # Thiếu tệp / JWKS hỏng thì PostgREST không khởi động (fail-closed). Không đặt db-anon-role: không token = 401 (PGRST302).
  # Danh sách schema (api_t<seq>) và pre-request lấy từ DB: xt.pgrst_config() / xt.pgrst_pre() (src/xt/adapters/db/sql).
  postgrest:
    <<: [*restart, *hardened]
    read_only: true
    user: "65534:65534"
    cpus: 1.0
    image: postgrest/postgrest:v16.4@sha256:d155c6718ed9a9f990d159a2ab7c0a3f16944dbb6d0a0344557421042acfe0df   # MIT
    profiles: [minimal, full, public]
    environment:
      PGRST_DB_URI: postgresql://xt_authenticator:${XT_PGRST_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      PGRST_DB_CONFIG: "true"                        # cấu hình động trong DB (xt.pgrst_config() ghi pgrst.db_schemas; NOTIFY pgrst khi tạo/xóa tenant)
      PGRST_DB_PRE_CONFIG: ${XT_PGRST_PRE_CONFIG:-xt.pgrst_config}
      PGRST_DB_PRE_REQUEST: ${XT_PGRST_PRE_REQUEST:-xt.pgrst_pre}
      PGRST_DB_SCHEMAS: ${XT_PGRST_BOOT_SCHEMAS:-xt_api_none}   # xt_api_none (khớp postgrest.sql) = schema rỗng luôn đứng đầu; xt.pgrst_config() thêm api_t<seq>
      PGRST_DB_EXTRA_SEARCH_PATH: ""                # không thêm public/extensions vào search_path của request
      PGRST_DB_POOL: "8"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_PLAN_ENABLED: "false"
      PGRST_OPENAPI_MODE: disabled                  # không lộ catalog qua GET /
      PGRST_JWT_SECRET: "@/run/secrets/pgrst/jwks.json"
      PGRST_JWT_SECRET_IS_BASE64: "false"
      PGRST_JWT_AUD: ${XT_PGRST_JWT_AUD:-xt-data}
      # Role CHỈ lấy từ claim ký sẵn data_role (mapper hardcoded của Keycloak = xt_web). Thiếu claim = 401 (không anon role).
      # Giá trị lạ cũng vô hại: xt_authenticator chỉ là thành viên của xt_web nên SET ROLE sang role khác bị từ chối.
      PGRST_JWT_ROLE_CLAIM_KEY: ${XT_PGRST_ROLE_CLAIM_KEY:-.data_role}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_PORT: "3001"               # chỉ trong mạng compose, dùng cho --ready
      PGRST_LOG_LEVEL: warn
    volumes:
      - type: bind
        source: ${XT_SECRETS_DIR:-${HOME}/.config/xt}/pgrst
        target: /run/secrets/pgrst
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 128m
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      retries: 20
      start_period: 5s

  xt-worker:
    <<: [*hardened]
    restart: on-failure:5
    read_only: true
    tmpfs: [/tmp]
    cpus: 1.0
    image: xt/xt:dev
    profiles: [minimal, full, public]
    networks: [default, files]   # files: dọn/quét lại tệp (job files.maintain)
    command: ["worker"]
    environment:
      <<: *xt-db-env
      XT_QUEUE_DATABASE_URL: postgresql://xt_control:${XT_DB_CONTROL_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      XT_WORKER_DATABASE_URL: postgresql://xt_app:${XT_DB_APP_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      XT_WORKER_CONCURRENCY: ${XT_WORKER_CONCURRENCY:-2}
      XT_WORKER_STALLED_SECONDS: ${XT_WORKER_STALLED_SECONDS:-30}
      XT_WORKER_RECOVER_SECONDS: ${XT_WORKER_RECOVER_SECONDS:-5}
      XT_WORKER_MAX_ATTEMPTS: ${XT_WORKER_MAX_ATTEMPTS:-3}
      XT_WORKER_RETRY_SECONDS: ${XT_WORKER_RETRY_SECONDS:-30}
      XT_DESK_URL: https://${XT_DOMAIN_DESK}
      XT_WORKER_HANDLERS: ${XT_WORKER_HANDLERS:-xt.entrypoints.composition.worker:handlers}
      XT_WORKFLOW_RELAY_SECONDS: ${XT_WORKFLOW_RELAY_SECONDS:-15}   # chu kỳ relay hẹn giờ SLA + outbox model
      # model.apply (đề xuất model đã duyệt): pha 1 DDL + pha 2 bằng role migrator
      XT_DB_MIGRATOR_URL: postgresql://xt_migrator:${XT_DB_MIGRATOR_PASSWORD:?chạy make env}@postgres:5432/${POSTGRES_DB:-xt}
      # Dịch vụ tệp: job files.maintain (dọn ý định hết hạn/quarantine, quét lại) — docs/files-api.md
      # Telegram display channel runs inside xt-api; delivery relay in xt-worker.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_LINK_CLIENTS: ${TELEGRAM_LINK_CLIENTS:-xt-cli,xt-desk-agent}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      XT_FILES_S3_ENDPOINT: http://seaweedfs:8333
      XT_FILES_S3_BUCKET: ${XT_FILES_S3_BUCKET:-xt-files}
      XT_FILES_S3_ACCESS_KEY: ${XT_FILES_S3_ACCESS_KEY:?chạy make env}
      XT_FILES_S3_SECRET_KEY: ${XT_FILES_S3_SECRET_KEY:?chạy make env}
      XT_FILES_PUBLIC_URL: https://${XT_DOMAIN_API}
      XT_FILES_CLAMD: ${XT_FILES_CLAMD:-}
      XT_CURSOR_KEY_FILE: /run/secrets/xt/cursor.key
    volumes:
      - type: bind
        source: ${XT_SECRETS_DIR:-${HOME}/.config/xt}/app
        target: /run/secrets/xt
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
      xt-init: {condition: service_completed_successfully}

  xt-desk:
    <<: [*restart, *hardened]
    read_only: true
    tmpfs: [/tmp]
    cpus: 0.5
    image: xt/desk:dev
    build:
      context: ../desk
      dockerfile: ../deploy/docker/desk.Dockerfile
      args:
        DESK_MCP_URL: https://${XT_DOMAIN_MCP}/mcp
        DESK_LLM_URL: ${DESK_LLM_URL}
        DESK_LLM_MODEL: ${DESK_LLM_MODEL}
        DESK_LLM_REASONING_EFFORT: ${DESK_LLM_REASONING_EFFORT:-}
        DESK_TOOL_PROFILE: ${DESK_TOOL_PROFILE}
        DESK_MAX_STEPS: ${DESK_MAX_STEPS}
        DESK_SANDBOX_URL: https://${XT_DOMAIN_API}/sandbox.html
        DESK_XT_ORIGIN: https://${XT_DOMAIN_DESK}
        DESK_AUTH_MODE: ${DESK_AUTH_MODE}
        DESK_OIDC_ISSUER: https://${XT_DOMAIN_AUTH}/realms/${XT_REALM}
        DESK_OIDC_CLIENT_ID: ${XT_DESK_AGENT_CLIENT_ID:-xt-desk-agent}
        DESK_OIDC_SCOPE: openid mcp-xt
        DESK_APP_CALLS_PER_SEC: ${DESK_APP_CALLS_PER_SEC}
        DESK_APP_CALL_BURST: ${DESK_APP_CALL_BURST}
        DESK_APP_MAX_INFLIGHT: ${DESK_APP_MAX_INFLIGHT}
        DESK_APP_MAX_ARGS_BYTES: ${DESK_APP_MAX_ARGS_BYTES}
        DESK_APP_GLOBAL_CALLS_PER_SEC: ${DESK_APP_GLOBAL_CALLS_PER_SEC}
        DESK_APP_GLOBAL_BURST: ${DESK_APP_GLOBAL_BURST}
    profiles: [minimal, full, public]
    mem_limit: 64m

  # ---------------- profile full (ảnh OSI, pin phiên bản) ----------------
  ollama:
    <<: [*restart, *nopriv]
    cpus: 4.0
    image: ollama/ollama:0.13.0@sha256:d4188c1dfa870386a14e299976aed96daeb83876b69e1a852c9d09ea76463b9f           # MIT
    profiles: [full]
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes: [ollama:/root/.ollama]
    mem_limit: 8g

  nats:
    <<: [*restart, *nopriv]
    cpus: 0.5
    image: nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00               # Apache-2.0
    profiles: [full]
    command: ["-js", "-sd", "/data"]
    volumes: [nats:/data]
    mem_limit: 128m

  # Tầng 1 "dữ liệu phi cấu trúc" (docs/files-api.md): một `weed server` (master+volume+filer+S3).
  # Không publish cổng, không route APISIX tới SeaweedFS (UI master/filer bị chặn, N10): chỉ xt-api
  # gọi S3 nội bộ (SigV4, danh tính duy nhất từ .env). User `seaweed` (uid 1000), không root.
  seaweedfs:
    <<: [*restart, *hardened]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cpus: 1.0
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d       # Apache-2.0
    profiles: [minimal, full, public]
    # research/footprint.md: volume 64 MB, tối đa 8 volume; đo 86-233 MiB RSS (sau PUT 20 MB).
    # Dung lượng = volume.max x 64 MB = 2 GiB (quota mặc định: 256 MiB/người, 1 GiB/tenant).
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/xt-s3/s3.json",
              "-master.volumeSizeLimitMB=64", "-volume.max=32", "-ip=127.0.0.1", "-ip.bind=0.0.0.0"]
    # FB-03: chỉ mạng nội bộ `files` (internal, không ra Internet, không chung mạng default với
    # keycloak/postgrest/desk/apisix); không `ports`. security.toml bật JWT cho volume + filer: chỉ
    # S3 (SigV4, khóa trong .env) đọc/ghi được byte; master/volume/filer trả 401 cho truy cập trực tiếp.
    networks: [files]
    configs:
      - source: seaweed-s3
        target: /etc/xt-s3/s3.json
        mode: 0444
      - source: seaweed-security
        target: /etc/seaweedfs/security.toml
        mode: 0444
    volumes: [seaweed:/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && nc -z 127.0.0.1 8333"]
      interval: 5s
      retries: 30

  clamav:
    <<: [*restart, *nopriv]
    cpus: 2.0
    image: clamav/clamav:1.4@sha256:b5b910ce43d595bf8a2fe401e34db56434602b2c755b7c2b07f00c917d04d469              # GPL-2.0, tiến trình riêng
    profiles: [full]
    networks: [files]   # chỉ xt-api/xt-worker gọi clamd
    volumes: [clamav:/var/lib/clamav]
    mem_limit: 2g

  openbao:
    <<: [*restart, *nopriv]
    cpus: 0.5
    image: openbao/openbao:2.4.1@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112          # MPL-2.0
    profiles: [full]
    # Dev mode (bộ nhớ, tự unseal): chỉ cho demo. Sản xuất cần cấu hình storage + unseal riêng.
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_TOKEN:-}
    cap_add: [IPC_LOCK]
    mem_limit: 256m

  # ---------------- profile public ----------------
  cloudflared:
    <<: [*restart, *hardened]
    cpus: 0.5
    read_only: true
    image: cloudflare/cloudflared:2025.9.1@sha256:4604b477520dc8322af5427da68b44f0bf814938e9d2e4814f2249ee4b03ffdf  # Apache-2.0
    profiles: [public]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # rỗng thì cloudflared tự báo lỗi
    # Ingress (4 hostname -> http://127.0.0.1:9080) cấu hình từ xa trên Cloudflare; connector chạy cùng
    # netns với APISIX để 127.0.0.1:9080 đúng như tài liệu.
    network_mode: "service:apisix"
    depends_on: [apisix]
    mem_limit: 128m

volumes:
  pgdata:
  ollama:
  nats:
  seaweed:
  clamav:

networks:
  default: {}
  # FB-03: SeaweedFS (+ clamd) chỉ nối mạng này; internal = không có route ra ngoài, không publish.
  files:
    internal: true

# Danh tính S3 duy nhất của SeaweedFS (xt-api); giá trị từ deploy/.env (envfile.py tự sinh).
configs:
  seaweed-s3:
    content: |
      {"identities": [{"name": "xt-api", "credentials": [{"accessKey": "${XT_FILES_S3_ACCESS_KEY:?chạy make env}", "secretKey": "${XT_FILES_S3_SECRET_KEY:?chạy make env}"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
  # JWT nội bộ của SeaweedFS (volume ghi/đọc, filer ghi/đọc): truy cập thẳng :8080/:8888 bị 401.
  seaweed-security:
    content: |
      # R2-F4: master/volume/filer chỉ nhận lệnh quản trị (/dir/assign, /col/delete, /vol/grow…)
      # từ loopback = gateway S3 trong cùng tiến trình `weed server`; peer trong mạng `files` bị 401.
      [guard]
      white_list = "127.0.0.1,@"   # @ = gRPC nội tiến trình (S3/filer -> master/volume)
      [jwt.signing]
      key = "${XT_SEAWEED_JWT_WRITE_KEY:?chạy make env}"
      expires_after_seconds = 10
      [jwt.signing.read]
      key = "${XT_SEAWEED_JWT_READ_KEY:?chạy make env}"
      expires_after_seconds = 10
      [jwt.filer_signing]
      key = "${XT_SEAWEED_FILER_JWT_WRITE_KEY:?chạy make env}"
      expires_after_seconds = 10
      [jwt.filer_signing.read]
      key = "${XT_SEAWEED_FILER_JWT_READ_KEY:?chạy make env}"
      expires_after_seconds = 10
